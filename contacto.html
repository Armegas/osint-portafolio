<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contacto | OSINT & Investigación Digital</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>📬 Contacto y Contratación</h1>
    <p>Solicita informes, auditorías o cursos directamente desde esta página.</p>
    <nav>
      <ul>
        <li><a href="index.html">Inicio</a></li>
        <li><a href="servicios.html">Servicios</a></li>
        <li><a href="casos.html">Casos de estudio</a></li>
        <li><a href="herramientas.html">Herramientas</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="formulario-contacto">
  <h2>📨 Solicita tu servicio</h2>
  <form action="https://formsubmit.co/nelson.pptcol@gmail.com" method="POST">
    <label for="nombre">Nombre completo:</label>
    <input type="text" id="nombre" name="nombre" required>

    <label for="email">Correo electrónico:</label>
    <input type="email" id="email" name="email" required>

    <label for="servicio">Servicio requerido:</label>
    <select id="servicio" name="servicio" required>
      <option value="">Selecciona una opción</option>
      <option value="informe-osint">Informe OSINT</option>
      <option value="auditoria-reputacional">Auditoría reputacional</option>
      <option value="curso-ciberseguridad">Curso de ciberseguridad</option>
      <option value="consultoria-tecnica">Consultoría técnica</option>
    </select>

    <label for="mensaje">Mensaje o requerimiento:</label>
    <textarea id="mensaje" name="mensaje" rows="5" required></textarea>

    <input type="hidden" name="_captcha" value="false">
    <input type="hidden" name="_next" value="https://tu-sitio.com/gracias.html">

    <button type="submit">Enviar solicitud</button>
  </form>
</section>
